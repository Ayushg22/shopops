global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alerts.yml'
  - 'rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'shopops-services'
    scrape_interval: 5s
    static_configs:
      - targets:
          - 'api-gateway:8000'
          - 'auth-service:8001'
          - 'catalog-service:8002'
          - 'order-service:8003'
          - 'inventory-service:8004'
          - 'payment-service:8005'
          - 'notification-service:8006'

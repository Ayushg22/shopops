groups:
  - name: shopops_alerts
    rules:
      - alert: ServiceHigh5xxErrorRate
        expr: rate(http_requests_total{status=~"5.."}[1m]) / rate(http_requests_total[1m]) * 100 > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on {{ $labels.service }}"
          description: "Service {{ $labels.service }} is experiencing > 5% 5xx errors."

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[1m])) > 1.0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.service }}"
          description: "p95 latency is exceeding 1 second."

      - alert: DatabaseConnectionPoolSaturated
        expr: pg_stat_activity_count / pg_settings_max_connections * 100 > 85
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL connections nearly exhausted"
          description: "Active connections exceed 85% of maximum capacity."

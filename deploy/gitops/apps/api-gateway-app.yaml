apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ayush-g/shopops.git
    targetRevision: HEAD
    path: deploy/helm/api-gateway
    helm:
      valueFiles:
        - ../values/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shopops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

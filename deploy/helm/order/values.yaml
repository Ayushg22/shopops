replicaCount: 2

image:
  repository: acrshopopsdev.azurecr.io/order
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

probes:
  liveness:
    httpGet:
      path: /health/live
      port: 80
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    httpGet:
      path: /health/ready
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 5

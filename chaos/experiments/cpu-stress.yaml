apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-stress-injector
  namespace: shopops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-stress
  template:
    metadata:
      labels:
        app: cpu-stress
    spec:
      containers:
        - name: stress
          image: vish/stress
          args: ["-cpus", "2"]
          resources:
            requests:
              cpu: 500m
            limits:
              cpu: 1000m
